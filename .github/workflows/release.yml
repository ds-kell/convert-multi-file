name: Release
# Push a tag like v0.1.0 to build installers for Windows, macOS and Linux
# and attach them to a draft GitHub Release (publish it after checking).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
          - os: macos-latest          # Apple Silicon
            args: --target aarch64-apple-darwin --bundles app,dmg
            rust_target: aarch64-apple-darwin
          - os: macos-latest          # Intel Macs
            args: --target x86_64-apple-darwin --bundles app,dmg
            rust_target: x86_64-apple-darwin
          - os: ubuntu-22.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json}
      - run: npm ci
        working-directory: app
      - run: cargo test --workspace
        if: matrix.rust_target != 'x86_64-apple-darwin'
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: app
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: ConvertApp ${{ github.ref_name }}
          releaseDraft: true
          releaseBody: |
            **Windows:** run `ConvertApp_*_x64-setup.exe`. SmartScreen may warn because the app is not code-signed: click *More info → Run anyway*.
            **macOS:** open the `.dmg` (`aarch64` = Apple Silicon, `x64` = Intel). The app is not notarized: right-click → *Open*, or run `xattr -cr /Applications/ConvertApp.app`.
            **Linux:** `.deb` for Debian/Ubuntu, `.AppImage` for everything else (`chmod +x` then run).
