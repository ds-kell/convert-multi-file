[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "app/src-tauri", "crates/shell"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["truyen.nt"]
publish = false

# Internal crates, referenced from members with `convertapp-core.workspace = true`.
[workspace.dependencies]
convertapp-core = { path = "crates/core" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
