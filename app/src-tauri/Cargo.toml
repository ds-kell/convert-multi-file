[package]
name = "convertapp"
description = "ConvertApp desktop application"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
convertapp-core.workspace = true
convertapp-shell.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.5"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
