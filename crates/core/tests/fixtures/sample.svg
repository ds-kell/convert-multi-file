<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100" viewBox="0 0 200 100">
  <!-- Left half: solid red. Right half: transparent. Used to check colours,
       size and alpha after rasterising. -->
  <rect x="0" y="0" width="100" height="100" fill="#ff0000"/>
  <circle cx="150" cy="50" r="30" fill="#0000ff" fill-opacity="0.5"/>
  <text x="10" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#ffffff">Xin chào</text>
</svg>
