[package]
name = "convertapp-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
comrak = { version = "0.59.0", default-features = false }
encoding_rs = "0.8.44"
htmd = "0.5.6"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "ico", "webp"] }
infer = "0.22.0"
lopdf = { version = "0.47.0", default-features = false }
miniz_oxide = "0.9.1"
pdf-writer = "0.15.0"
resvg = "0.49.0"
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
url = "2.5.8"
webp = { version = "0.3.1", default-features = false }

[lints]
workspace = true

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
