[package]
name = "convertapp-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
comrak = { version = "0.59.0", default-features = false }
encoding_rs = "0.8.44"
htmd = "0.5.6"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "ico", "webp"] }
infer = "0.22.0"
miniz_oxide = "0.9.1"
pdf-writer = "0.15.0"
resvg = "0.49.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
webp = { version = "0.3.1", default-features = false }

[lints]
workspace = true

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
